# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f "Schedule Creator/requirements.txt" ]; then
            python -m pip install -r "Schedule Creator/requirements.txt"
          fi

      - name: Check for syntax errors and undefined names
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report style and complexity issues
        run: python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run the project test suite
        run: python "Schedule Creator/tests/run_all_tests.py"
